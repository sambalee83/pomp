<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pomp! – tyylilinjaus</title>
<meta name="theme-color" content="#1D1147">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --yo: #1D1147; --kerma: #FFF4D6; --keltainen: #FFC93C; --minttu: #3DE0B0;
    --fontti: Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--yo); color: var(--kerma);
    font-family: var(--fontti); -webkit-user-select: none; user-select: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  /* Diojen pisteet */
  #pisteet { position: fixed; left: 50%; bottom: max(6px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; z-index: 2; }
  #pisteet button { appearance: none; -webkit-appearance: none; border: 0; background: none; padding: 8px 5px; cursor: pointer; }
  #pisteet button span { display: block; width: 10px; height: 10px; border-radius: 999px; background: var(--kerma); opacity: 0.32;
    transition: width 0.3s cubic-bezier(.3, 1.4, .5, 1), opacity 0.2s, background-color 0.2s; }
  #pisteet button[aria-current="true"] span { width: 30px; opacity: 1; background: var(--keltainen); }
  #pisteet button:focus-visible { outline: 2px solid var(--minttu); outline-offset: -2px; border-radius: 999px; }
  @media (max-height: 480px) {
    #pisteet button { padding: 5px 4px; }
    #pisteet button span { width: 7px; height: 7px; }
    #pisteet button[aria-current="true"] span { width: 20px; }
  }

  .pieni { position: fixed; margin: 0; font-size: 0.8rem; font-weight: 500; opacity: 0; pointer-events: none;
    transition: opacity 0.6s; z-index: 2; }
  .pieni.nakyy { opacity: 0.6; }
  #vihje { right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
  #auto { left: max(14px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); color: var(--minttu); }
  #esilataus { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; }
  #esilataus span { font-family: Fredoka; }

  #kaanna { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    padding: 1.5rem; text-align: center; background: var(--yo); font-size: 1.3rem; font-weight: 500; }
  @media (orientation: portrait) and (pointer: coarse) { #kaanna { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #pisteet button span, .pieni { transition: none; } }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Pomp! – tyylilinjaus. Kuusi diaa: logo, väripaletti ja typografia, hahmo, käyttöliittymä, esimerkkipeli ja tehosteet."></canvas>
<nav id="pisteet" aria-label="Diat"></nav>
<p id="vihje" class="pieni">Selaa: ← → tai napauta ruudun reunaa</p>
<p id="auto" class="pieni">Automaattinen vaihto päällä (A)</p>
<div id="esilataus" aria-hidden="true"><span style="font-weight:400">a</span><span style="font-weight:500">a</span><span style="font-weight:600">a</span><span style="font-weight:700">a</span></div>
<div id="kaanna">Käännä puhelin vaakaan.</div>

<script>
// Pomp! – tyylilinjaus. Kaikki grafiikka piirretään koodilla (Canvas 2D), ei kuvatiedostoja.
// Rakenne: 1 apuvälineet · 2 värit · 3 näkymä · 4 piirtoapurit · 5 hiukkaset · 6 hahmo · 7 asennot
//          8 käyttöliittymän osat · 9 diat · 10 selaus ja pääsilmukka
(() => {
'use strict';

// ───────────────────────── 1. Apuvälineet ─────────────────────────
const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = (x) => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => sat((t - a) / (b - a));           // etenemä aikavälillä a…b
const smooth = (t) => { t = sat(t); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const E = { // pehmennykset: mikään ei liiku tasaisella nopeudella
  inQuad: (t) => { t = sat(t); return t * t; },
  inCubic: (t) => { t = sat(t); return t * t * t; },
  outCubic: (t) => 1 - Math.pow(1 - sat(t), 3),
  inOutCubic: (t) => { t = sat(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  outBack: (t) => { t = sat(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: (t) => { t = sat(t); return t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1; },
};
function mulberry(seed) { // toistettava satunnaisluku (tähtitaivas pysyy samana)
  return () => { let t = (seed += 0x6D2B79F5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); // vähennetty liike
const N = (n) => Math.max(1, Math.round(n * (RM ? 0.5 : 1)));  // hiukkasmäärä

// ───────────────────────── 2. Värit ja fontti ─────────────────────────
const C = {
  yo: '#1D1147', yoSyva: '#120A30', yoVaalea: '#3B2596', viiva: '#3A2156',
  kelt: '#FFC93C', keltVarjo: '#F0A81E', keltValo: '#FFE08A', keltSyva: '#C98A00',
  oikea: '#FF4057', oikeaVarjo: '#C92445', vasen: '#2D8CFF', vasenVarjo: '#1B66CC',
  minttu: '#3DE0B0', minttuVarjo: '#1FA886', kerma: '#FFF4D6', laventeli: '#B7A8FF',
  kivi: '#D8CFFA', kiviVarjo: '#A698E8',
};
const FONT = 'Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';
const font = (w, size) => `${w} ${size}px ${FONT}`;
const OUT = 5; // ääriviivan paksuus suunnittelupikseleinä (1600 leveällä)

// ───────────────────────── 3. Näkymä ─────────────────────────
// Sisältö suunnitellaan 1600×900-alueelle, joka skaalataan ruutuun. Reunojen yli jäävä tila
// (view.x0…x1, y0…y1) täytetään taustalla, pelinäkymä piirtää sen täyteen.
const DW = 1600, DH = 900;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const view = { W: 1, H: 1, dpr: 1, s: 1, ox: 0, oy: 0, x0: 0, x1: DW, y0: 0, y1: DH };
let fontVer = 0;

function resize() {
  const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  view.W = W; view.H = H; view.dpr = dpr;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  view.s = Math.min(W / DW, H / DH);
  view.ox = (W - DW * view.s) / 2; view.oy = (H - DH * view.s) / 2;
  view.x0 = -view.ox / view.s; view.x1 = DW + view.ox / view.s;
  view.y0 = -view.oy / view.s; view.y1 = DH + view.oy / view.s;
  buildBg();
}
function setDesign(shift) { // piirtokoordinaatisto = suunnittelualue
  const k = view.dpr * view.s;
  ctx.setTransform(k, 0, 0, k, view.dpr * (view.ox + (shift || 0) * view.s), view.dpr * view.oy);
}
function buildBg() { // tausta piirretään kerran puolella tarkkuudella (pelkkiä liukuja)
  const w = bg.width = Math.max(2, Math.ceil(cv.width / 2)), h = bg.height = Math.max(2, Math.ceil(cv.height / 2));
  const g = bg.getContext('2d');
  g.fillStyle = C.yo; g.fillRect(0, 0, w, h);
  g.save(); g.translate(w / 2, h * 1.05); g.scale(w * 0.62, h * 0.92);
  let gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  gr.addColorStop(0, 'rgba(59,37,150,1)'); gr.addColorStop(0.7, 'rgba(45,27,112,0.35)'); gr.addColorStop(1, 'rgba(29,17,71,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill();
  g.restore();
  gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) / 2); // vinjetti
  gr.addColorStop(0, 'rgba(10,5,32,0)'); gr.addColorStop(1, 'rgba(10,5,32,0.5)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
const SKY = (() => { const r = mulberry(7); return Array.from({ length: 44 }, () => ({ x: r(), y: r() * 0.6, r: 1.2 + r() * 1.8, f: 0.5 + r() * 1.3, ph: r() * TAU })); })();
function drawSkyStars(t, yMax) {
  ctx.fillStyle = C.kerma;
  for (const s of SKY) {
    const y = lerp(view.y0, yMax, s.y);
    ctx.globalAlpha = 0.22 + 0.2 * (RM ? 0.5 : 0.5 + 0.5 * Math.sin(t * s.f + s.ph));
    ctx.beginPath(); ctx.arc(lerp(view.x0, view.x1, s.x), y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ───────────────────────── 4. Piirtoapurit ─────────────────────────
function rr(c, x, y, w, h, r) { // pyöristetty suorakulmio
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function txt(s, x, y, size, col, w, align, base) {
  ctx.font = font(w || 600, size); ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'alphabetic';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const ctext = (s, x, y, size, col, w) => txt(s, x, y + size * 0.05, size, col, w, 'center', 'middle'); // keskitetty
// Tasavarjostus: perusväri + tumma sirppi oikeassa alareunassa (valo tulee vasemmalta ylhäältä).
// path() aloittaa itse polun. inner() piirretään muodon sisään rajattuna.
function celFill(c, path, base, dark, dx, dy, inner) {
  path(); c.fillStyle = base; c.fill();
  c.save(); path(); c.clip();
  c.fillStyle = dark; path(); c.fill();
  c.save(); c.translate(dx, dy); path(); c.fillStyle = base; c.fill(); c.restore();
  if (inner) inner();
  c.restore();
}
function starPath(c, x, y, r, rot, inner) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - PI / 2 + i * PI / 5, q = i % 2 ? r * inner : r;
    if (i) c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); else c.moveTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  c.closePath();
}
function sparklePath(c, x, y, r, rot) { // nelisakarainen kipinä
  c.beginPath(); c.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
  for (let i = 0; i < 4; i++) {
    const a = rot + (i + 1) * PI / 2, b = rot + i * PI / 2 + PI / 4;
    c.quadraticCurveTo(x + Math.cos(b) * r * 0.14, y + Math.sin(b) * r * 0.14, x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  c.closePath();
}
function drawStar(c, x, y, r, rot, ow) { // keräiltävä tähti: pyöreät kärjet, ääriviiva, vaalea sydän
  if (r <= 0.5) return;
  c.save(); c.lineJoin = 'round';
  const soft = r * 0.3;
  starPath(c, x, y, r * 0.86, rot, 0.52);
  if (ow) { c.strokeStyle = C.viiva; c.lineWidth = soft + ow * 2; c.stroke(); }
  c.strokeStyle = C.kelt; c.lineWidth = soft; c.stroke(); c.fillStyle = C.kelt; c.fill();
  starPath(c, x - r * 0.05, y - r * 0.07, r * 0.5, rot, 0.52);
  c.strokeStyle = c.fillStyle = C.keltValo; c.lineWidth = soft * 0.5; c.stroke(); c.fill();
  c.beginPath(); c.arc(x - r * 0.2, y - r * 0.26, r * 0.085, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();
  c.restore();
}
function drawRock(c, x, y, s, sy) { // este: vaalea kivi
  c.save(); c.translate(x, y); c.scale(s, s * (sy == null ? 1 : sy)); c.lineJoin = 'round';
  const p = () => { c.beginPath(); c.moveTo(-50, 0); c.quadraticCurveTo(-60, -46, -22, -62); c.quadraticCurveTo(10, -74, 38, -52); c.quadraticCurveTo(60, -34, 50, 0); c.closePath(); };
  celFill(c, p, C.kivi, C.kiviVarjo, -8, -9, () => {
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.ellipse(-22, -42, 12, 6, -0.6, 0, TAU); c.fill();
    c.fillStyle = C.kiviVarjo; c.beginPath(); c.arc(10, -22, 4.5, 0, TAU); c.fill(); c.beginPath(); c.arc(24, -36, 3, 0, TAU); c.fill();
  });
  p(); c.strokeStyle = C.viiva; c.lineWidth = OUT / s; c.stroke();
  c.restore();
}
function depthText(c, str, x, y, size, face, edge) { // syvyystekstit suurille hetkille (3-2-1-POMP!)
  const d = size * 0.085;
  c.font = font(700, size); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  c.strokeStyle = C.viiva; c.lineWidth = size * 0.1;
  c.strokeText(str, x, y + d); c.strokeText(str, x, y + d * 0.5); c.strokeText(str, x, y);
  c.fillStyle = edge; for (let i = 4; i >= 1; i--) c.fillText(str, x, y + d * i / 4);
  c.fillStyle = face; c.fillText(str, x, y);
}

// ───────────────────────── 5. Hiukkaset ja tehosteet ─────────────────────────
class Particles {
  constructor(max) { this.a = []; this.max = max || 300; }
  add(o) { if (this.a.length >= this.max) this.a.shift(); o.t = 0; this.a.push(o); return o; }
  clear() { this.a.length = 0; }
  update(dt) {
    const a = this.a;
    for (let i = a.length - 1; i >= 0; i--) {
      const p = a[i]; p.t += dt;
      if (p.t >= p.life) { a.splice(i, 1); continue; }
      p.vy += (p.g || 0) * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot = (p.rot || 0) + (p.vr || 0) * dt;
    }
  }
  draw(c) {
    for (const p of this.a) {
      const k = p.t / p.life;
      switch (p.type) {
        case 'puff': {
          c.globalAlpha = (p.a || 0.5) * Math.pow(1 - k, 1.4); c.fillStyle = p.col;
          c.beginPath(); c.arc(p.x, p.y, p.r * (0.45 + 0.75 * E.outCubic(k)), 0, TAU); c.fill(); break;
        }
        case 'star': case 'spark': {
          const s = Math.max(0, E.outBack(k * 4) * (1 - E.inCubic(seg(k, 0.5, 1))));
          if (s <= 0.01) break;
          c.globalAlpha = 1; c.fillStyle = p.col;
          if (p.type === 'star') starPath(c, p.x, p.y, p.r * s, p.rot, 0.5); else sparklePath(c, p.x, p.y, p.r * s, p.rot);
          c.fill(); break;
        }
        case 'ring': {
          const e = E.outCubic(k);
          c.globalAlpha = 1 - k; c.strokeStyle = p.col; c.lineWidth = Math.max(0.5, p.w * (1 - e));
          c.beginPath(); c.arc(p.x, p.y, lerp(p.r0, p.r1, e), 0, TAU); c.stroke(); break;
        }
        case 'conf': {
          c.globalAlpha = 1 - E.inCubic(seg(k, 0.7, 1));
          c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, Math.cos(p.t * p.flip));
          c.fillStyle = p.col; rr(c, -p.w / 2, -p.h / 2, p.w, p.h, Math.min(p.w, p.h) * 0.3); c.fill(); c.restore(); break;
        }
        case 'text': {
          const s = Math.max(0.01, E.outBack(k * 3.5));
          c.globalAlpha = 1 - E.inCubic(seg(k, 0.6, 1));
          c.save(); c.translate(p.x, p.y); c.scale(s, s);
          c.font = font(700, p.size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
          c.strokeStyle = C.viiva; c.lineWidth = p.size * 0.22; c.strokeText(p.str, 0, 0);
          c.fillStyle = p.col; c.fillText(p.str, 0, 0); c.restore(); break;
        }
      }
    }
    c.globalAlpha = 1;
  }
}
// Tehosteet: s = mittakaava. Värit: vain keltainen, minttu, kerma ja laventeli (punainen/sininen on varattu käsille).
function fxDust(ps, x, y, s, n, power) {
  for (let i = 0; i < N(n); i++) {
    const d = i % 2 ? 1 : -1;
    ps.add({ type: 'puff', x: x + d * rand(6, 22) * s, y: y - rand(0, 8) * s, vx: d * rand(50, 190) * s * power, vy: -rand(10, 70) * s,
      drag: 3.5, r: rand(10, 19) * s, life: rand(0.35, 0.6), col: '#CFC4FF', a: 0.42 });
  }
}
function fxStars(ps, x, y, s, n) {
  for (let i = 0; i < N(n); i++) {
    const a = -PI / 2 + rand(-1.15, 1.15), v = rand(190, 380) * s;
    ps.add({ type: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 620 * s, drag: 1.2, r: rand(9, 15) * s,
      rot: rand(0, TAU), vr: rand(-4, 4), life: rand(0.5, 0.8), col: pick([C.kelt, C.kerma, C.minttu]) });
  }
}
function fxCollect(ps, x, y, s) {
  ps.add({ type: 'ring', x, y, vx: 0, vy: 0, r0: 16 * s, r1: 78 * s, w: 12 * s, life: 0.4, col: C.minttu });
  const n = N(10), o = rand(0, TAU);
  for (let i = 0; i < n; i++) {
    const a = o + i * TAU / n, v = rand(230, 380) * s;
    ps.add({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 4, r: rand(13, 22) * s, rot: rand(0, TAU), vr: rand(-3, 3),
      life: rand(0.4, 0.62), col: i % 3 === 0 ? C.kerma : i % 3 === 1 ? C.minttu : C.kelt });
  }
  ps.add({ type: 'text', x, y: y - 26 * s, vx: 0, vy: -120 * s, drag: 2.2, life: 0.8, str: '+1', size: 46 * s, col: C.minttu });
}
function fxHit(ps, x, y, s) {
  ps.add({ type: 'ring', x, y, vx: 0, vy: 0, r0: 20 * s, r1: 110 * s, w: 14 * s, life: 0.35, col: C.kerma });
  fxDust(ps, x, y + 30 * s, s, 6, 1.2);
  for (let i = 0; i < N(6); i++) {
    const a = rand(0, TAU), v = rand(240, 420) * s;
    ps.add({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 4.5, r: rand(12, 20) * s, rot: rand(0, TAU), life: rand(0.3, 0.5), col: C.kerma });
  }
}
function fxConfetti(ps, x, y, dir, n) {
  for (let i = 0; i < N(n); i++) {
    const a = -PI / 2 + dir * rand(0.15, 0.95), v = rand(420, 820);
    ps.add({ type: 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 950, drag: 1.1, w: rand(12, 20), h: rand(8, 12),
      rot: rand(0, TAU), vr: rand(-6, 6), flip: rand(7, 13), life: rand(1.2, 1.9), col: pick([C.kelt, C.minttu, C.kerma, C.laventeli]) });
  }
}
function smoothTrail(pts) { // Catmull–Rom-tasoitus: harvatkin näytteet (kamera ~30 kertaa sekunnissa) piirtyvät kaarena
  const n = pts.length, out = [];
  const cr = (a, b, c, d, u) => 0.5 * (2 * b + (c - a) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (3 * b - a - 3 * c + d) * u * u * u);
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let k = 0; k < 4; k++) { const u = k / 4; out.push({ x: cr(p0.x, p1.x, p2.x, p3.x, u), y: cr(p0.y, p1.y, p2.y, p3.y, u), t: lerp(p1.t, p2.t, u) }); }
  }
  out.push(pts[n - 1]);
  return out;
}

const LOGO = { str: 'Pomp!', size: 330, key: '', sp: [], width: 0 };

    g.strokeText(ch, pad, by);

const s5 = {

    this.phase = ''; this.hitT = 9; this.shakeT = 9; this.runPh = 0; this.runK = 1; this.rig.reset(); this.ps.clear(); this.update(0);
  },
  spawn(k) {

      ctx.beginPath();                                  // yksi polku → päällekkäiset osat eivät tummu
      for (const [ox, oy, r] of [[-62, 6, 34], [-18, -16, 46], [36, -6, 40], [78, 12, 28]]) { ctx.moveTo(cx + (ox + r) * s, cy + oy * s); ctx.arc(cx + ox * s, cy + oy * s, r * s, 0, TAU); }
      ctx.rect(cx - 62 * s, cy + 6 * s, 140 * s, 34 * s); ctx.fill();
    }
    // kukkulat ja puut
    g.layer(HILLS[0]);
    const off1 = g.layer(HILLS[1]);
    ctx.fillStyle = '#4733AE';
    for (let n = Math.floor((off1 + X0 - 120) / 520); n <= Math.ceil((off1 + X1 + 120) / 520); n++) {
      const lx = n * 520 + 150 * (hash(n) - 0.5), x = lx - off1, y = hillY(HILLS[1], lx) + 8, s = 0.85 + 0.4 * hash(n + 9);
      ctx.fillRect(x - 6 * s, y - 62 * s, 12 * s, 66 * s);
      ctx.beginPath(); ctx.arc(x, y - 88 * s, 42 * s, 0, TAU); ctx.moveTo(x + 52 * s, y - 62 * s); ctx.arc(x + 26 * s, y - 62 * s, 26 * s, 0, TAU); ctx.fill();
    }
    const off2 = g.layer(HILLS[2]);
    ctx.fillStyle = HILLS[2].col;
    for (let n = Math.floor((off2 + X0 - 80) / 380); n <= Math.ceil((off2 + X1 + 80) / 380); n++) {
      const lx = n * 380 + 120 * (hash(n + 40) - 0.5), x = lx - off2, y = hillY(HILLS[2], lx), r = 30 + 18 * hash(n + 3);
      ctx.beginPath(); ctx.arc(x, y - r * 0.3, r, 0, TAU); ctx.moveTo(x + r * 1.9, y); ctx.arc(x + r * 1.1, y - r * 0.1, r * 0.75, 0, TAU); ctx.fill();
    }

    // maailma (tärähtää kevyesti osumassa)
    ctx.save();
    if (g.shakeT < 0.45 && !RM) { const a = 9 * Math.exp(-g.shakeT * 9); ctx.translate(a * Math.sin(g.shakeT * 62), a * 0.6 * Math.cos(g.shakeT * 77)); }
    const soil = ctx.createLinearGradient(0, GY, 0, view.y1); soil.addColorStop(0, '#3F2BA2'); soil.addColorStop(1, '#22145C');
    ctx.fillStyle = soil; ctx.fillRect(X0, GY - 4, VW, view.y1 - GY + 60);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let n = Math.floor((g.wx + X0 - 60) / 240); n <= Math.ceil((g.wx + X1 + 60) / 240); n++) {
      ctx.beginPath(); ctx.ellipse(n * 240 + 120 * hash(n + 70) - g.wx, GY + 52 + 86 * hash(n + 5), 20 + 16 * hash(n + 2), 7, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(14,6,40,0.28)'; ctx.fillRect(X0, GY + 14, VW, 9);          // reunuksen varjo
    ctx.fillStyle = '#8B78F0'; ctx.fillRect(X0, GY - 10, VW, 24);                    // polun reunus
    ctx.fillStyle = '#AC9CFB'; ctx.fillRect(X0, GY - 10, VW, 5);
    ctx.fillStyle = '#7460E0';
    for (let n = Math.floor((g.wx + X0 - 60) / 180); n <= Math.ceil((g.wx + X1 + 60) / 180); n++) { rr(ctx, n * 180 - g.wx, GY + 1, 48, 8, 4); ctx.fill(); }

    for (const e of g.ents) { // esteet ja tähdet
      const x = e.x - g.wx; if (x < X0 - 120 || x > X1 + 120) continue;
      if (e.type === 'rock') {
        ctx.fillStyle = 'rgba(14,6,40,0.35)'; ctx.beginPath(); ctx.ellipse(x, GY + 4, 62, 9, 0, 0, TAU); ctx.fill();
        const wob = e.bump < 0.5 && !RM ? 1 - 0.14 * Math.exp(-e.bump * 8) * Math.cos(e.bump * 40) : 1;
        ctx.save(); ctx.translate(x, GY + 4); ctx.scale(e.flip, 1); drawRock(ctx, 0, 0, 1, wob); ctx.restore();
      } else {
        const y = e.y + (RM ? 0 : 7 * Math.sin(t * 3 + e.ph));
        const gl = ctx.createRadialGradient(x, y, 6, x, y, 64); gl.addColorStop(0, 'rgba(255,224,138,0.4)'); gl.addColorStop(1, 'rgba(255,224,138,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 64, 0, TAU); ctx.fill();
        drawStar(ctx, x, y, 31, RM ? 0 : 0.14 * Math.sin(t * 2.2 + e.ph), OUT);
      }
    }
    drawCharacterShadow(ctx, g.P, GU, GY + 2);
    const blinkOff = !RM && g.hitT > 0.12 && g.hitT < 0.7 && ((g.hitT * 12) | 0) % 2 === 1;                // osuman jälkeen hahmo vilkkuu hetken
    if (!blinkOff) drawCharacter(ctx, g.P, GU, g.rig.state);
    g.ps.draw(ctx);
    ctx.fillStyle = '#160C3C';                                                       // etualan pensaat
    for (let n = Math.floor((g.wx * 1.35 + X0 - 300) / 1500); n <= Math.ceil((g.wx * 1.35 + X1 + 300) / 1500); n++) {
      const x = n * 1500 + 500 * hash(n + 21) - g.wx * 1.35, y = view.y1 + 46;
      ctx.beginPath(); ctx.arc(x, y, 92, 0, TAU); ctx.moveTo(x + 190, y + 10); ctx.arc(x + 110, y + 10, 70, 0, TAU); ctx.moveTo(x - 30, y + 20); ctx.arc(x - 90, y + 20, 58, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // HUD: vain pisteet ja aika
    uiScore(view.x0 + 56, view.y0 + 44, g.score, g.popT);
    uiTime(view.x1 - 56 - 420, view.y0 + 58, 420, 64, 1 - (t % 40) / 40, t);
    rr(ctx, DW / 2 - 330, 786, 660, 50, 25); ctx.fillStyle = 'rgba(18,10,48,0.6)'; ctx.fill();
    ctext('Esimerkkipeli · Hyppää kivien yli ja kerää tähdet', DW / 2, 811, 25, 'rgba(255,244,214,0.9)', 500);
  },
};

// ── Dia 6: tehosteet ──
const TILE = { A: [90, 165, 453, 300], B: [573, 165, 453, 300], C: [1056, 165, 454, 300], D: [90, 495, 453, 325], E: [573, 495, 937, 325] };
function tile(r, name, fn) {
  const [x, y, w, h] = r;
  panel(x, y, w, h, 40);
  ctx.save(); rr(ctx, x, y, w, h, 40); ctx.clip(); fn(x, y, w, h); ctx.restore();
  txt(name, x + 28, y + h - 26, 27, C.kerma, 600);
}
const bez = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
const s6 = {
  name: 'Tehosteet', t: 0,
  A: { ct: 0, pc: -1, ps: new Particles(80), rig: new CharacterRig(), P: null, phase: '' },
  B: { ct: 0, pc: -1, ps: new Particles(80) },
  Cc: { ct: 0, pc: -1, ps: new Particles(60), trail: [[], []] },
  D: { ct: 0, pc: -1, ps: new Particles(60) },
  Eb: { ct: 0, pc: -1, ps: new Particles(160) },
  enter() {
    this.t = 0;
    for (const o of [this.A, this.B, this.Cc, this.D, this.Eb]) { o.ct = 0; o.pc = -1; o.ps.clear(); }
    this.A.rig.reset(); this.A.phase = ''; this.Cc.trail = [[], []]; this.update(0);
  },
  swipe(i, c) { // käden paikka ajan funktiona: nopea viilto, hidas paluu
    const [x, y, w, h] = TILE.C, a = i ? 2.0 : 0.45;
    const k = c < a ? 0 : c < a + 0.3 ? E.inOutCubic((c - a) / 0.3) : c < a + 0.65 ? 1 : c < a + 1.3 ? 1 - E.inOutCubic((c - a - 0.65) / 0.65) : 0;
    const s = i ? -1 : 1, cx = x + w / 2;
    const x0 = cx + s * 130, y0 = y + 72, x1 = cx - s * 120, y1 = y + h - 108, mx = cx + s * 70, my = y + h - 70;
    return { x: bez(x0, mx, x1, k), y: bez(y0, my, y1, k), fast: c >= a && c < a + 0.3, k };
  },
  update(dt) {
    this.t += dt; const t = this.t;
    { // A: hyppy
      const o = this.A, [x, y, w, h] = TILE.A, gy = y + h - 74, cx = x + w / 2, u = 27;
      cyc(o, dt, 2.3);
      const p = poseIdle(t), js = jumpState(o.ct - 0.7), phase = js ? js.phase : '';
      if (js) { applyJump(p, js); if (phase === 'air') o.rig.cheer(1); }
      if (phase !== o.phase) {
        if (phase === 'air') { fxDust(o.ps, cx, gy, 0.55, 6, 0.7); fxStars(o.ps, cx, gy - 10, 0.6, 6); }
        if (phase === 'land') fxDust(o.ps, cx, gy, 0.6, 8, 0.9);
        o.phase = phase;
      }
      o.P = buildPose(p, cx, gy, u); o.rig.update(o.P, u, dt); o.ps.update(dt);
    }
    { const o = this.B, [x, y, w] = TILE.B; cyc(o, dt, 2.2); if (hitAt(o, 1.3)) fxCollect(o.ps, x + w / 2, y + 122, 1); o.ps.update(dt); }
    { // C: viilto
      const o = this.Cc; cyc(o, dt, 3.5);
      for (let i = 0; i < 2; i++) {
        const s = this.swipe(i, o.ct), tr = o.trail[i];
        if (s.fast) { tr.push({ x: s.x, y: s.y, t }); if (Math.random() < 0.5) o.ps.add({ type: 'spark', x: s.x, y: s.y, vx: rand(-80, 80), vy: rand(-80, 80), drag: 3, r: rand(8, 14), rot: rand(0, TAU), life: rand(0.25, 0.4), col: C.kerma }); }
        while (tr.length && t - tr[0].t > 0.3) tr.shift();
      }
      o.ps.update(dt);
    }
    { const o = this.D, [x, y, w, h] = TILE.D; cyc(o, dt, 2.5); if (hitAt(o, 0.95)) { fxDust(o.ps, x + w / 2, y + h - 80, 1, 10, 1.6); o.ps.add({ type: 'ring', x: x + w / 2, y: y + h - 84, vx: 0, vy: 0, r0: 30, r1: 150, w: 12, life: 0.35, col: C.kerma }); } o.ps.update(dt); }
    { const o = this.Eb, [x, y, w, h] = TILE.E; cyc(o, dt, 4.2); if (hitAt(o, 0.5)) { fxConfetti(o.ps, x + 150, y + h - 40, 1, 22); fxConfetti(o.ps, x + w - 150, y + h - 40, -1, 22); } o.ps.update(dt); }
  },
  draw() {
    const t = this.t;
    slideHeader(6, 'Tehosteet');
    tile(TILE.A, 'Hyppy: pöly ja tähdet', (x, y, w, h) => {
      const o = this.A, gy = y + h - 74;
      ctx.fillStyle = 'rgba(255,244,214,0.10)'; ctx.fillRect(x, gy + 6, w, 3);
      drawCharacterShadow(ctx, o.P, 27, gy + 2); o.ps.draw(ctx); drawCharacter(ctx, o.P, 27, o.rig.state);
    });
    tile(TILE.B, 'Keräys: kipinät ja +1', (x, y, w) => {
      const o = this.B, c = o.ct, cx = x + w / 2, cy = y + 122;
      if (c < 1.3) {
        const s = RM ? sat(c / 0.2) : E.outBack(c / 0.4), bob = RM ? 0 : 7 * Math.sin(t * 3);
        const gl = ctx.createRadialGradient(cx, cy + bob, 8, cx, cy + bob, 92); gl.addColorStop(0, 'rgba(255,224,138,0.4)'); gl.addColorStop(1, 'rgba(255,224,138,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy + bob, 92, 0, TAU); ctx.fill();
        drawStar(ctx, cx, cy + bob, 46 * s, RM ? 0 : 0.14 * Math.sin(t * 2.2), OUT);
      } else if (c < 1.42) { drawStar(ctx, cx, cy, 46 * (1 + 2.2 * (c - 1.3)) * (1 - seg(c, 1.3, 1.42) * 0.7), 0, OUT); }
      o.ps.draw(ctx);
    });
    tile(TILE.C, 'Viilto: käden vana', () => {
      const o = this.Cc;
      for (let i = 0; i < 2; i++) drawTrail(ctx, o.trail[i], t, 0.3, 21, i ? C.vasen : C.oikea);
      o.ps.draw(ctx);
      for (let i = 0; i < 2; i++) { const s = this.swipe(i, o.ct); gloveAt(s.x, s.y, 84, i ? -1 : 1, PI / 2 + (i ? -1 : 1) * (0.5 + 0.5 * s.k) - PI); }
    });
    tile(TILE.D, 'Osuma: kevyt tärähdys', (x, y, w, h) => {
      const o = this.D, c = o.ct, gy = y + h - 80, cx = x + w / 2, k = c - 0.95;
      if (k >= 0 && k < 0.45 && !RM) { const a = 8 * Math.exp(-k * 9); ctx.translate(a * Math.sin(k * 62), a * 0.6 * Math.cos(k * 77)); }
      ctx.fillStyle = 'rgba(255,244,214,0.10)'; ctx.fillRect(x - 20, gy + 6, w + 40, 3);
      const fall = E.inQuad(seg(c, 0.5, 0.95)), ry = lerp(y - 60, gy + 6, fall), out = 1 - E.inCubic(seg(c, 2.1, 2.4));
      const sy = k >= 0 && !RM ? 1 - 0.22 * Math.exp(-k * 7) * Math.cos(k * 24) : 1;
      ctx.fillStyle = `rgba(14,6,40,${(0.38 * fall * out).toFixed(3)})`; ctx.beginPath(); ctx.ellipse(cx, gy + 8, 86 * (0.5 + 0.5 * fall), 11, 0, 0, TAU); ctx.fill();
      o.ps.draw(ctx);
      if (c >= 0.5 && out > 0.02) drawRock(ctx, cx, ry, 1.35 * out, sy);
    });
    tile(TILE.E, 'Onnistuminen: ”Hienoa!”', (x, y, w, h) => {
      const o = this.Eb, c = o.ct, cx = x + w / 2, cy = y + h / 2 - 26;
      const sc = (RM ? sat((c - 0.4) / 0.2) : E.outBack((c - 0.4) / 0.5)) * (1 - E.inCubic(seg(c, 3.2, 3.5)));
      o.ps.draw(ctx);
      if (c > 0.4 && sc > 0.01) {
        const W = 520, H = 118, D = 13;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.035 + (RM ? 0 : 0.02 * Math.sin(t * 2))); ctx.scale(sc, sc);
        ctx.lineJoin = 'round'; ctx.strokeStyle = C.viiva; ctx.lineWidth = OUT;
        rr(ctx, -W / 2, -H / 2 + D, W, H, H / 2); ctx.fillStyle = C.minttuVarjo; ctx.fill(); ctx.stroke();
        const g = ctx.createLinearGradient(0, -H / 2, 0, H / 2); g.addColorStop(0, '#62EBC3'); g.addColorStop(1, C.minttu);
        rr(ctx, -W / 2, -H / 2, W, H, H / 2); ctx.fillStyle = g; ctx.fill();
        ctx.save(); ctx.clip();
        ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(0, -H / 2, W * 0.6, H * 0.42, 0, 0, TAU); ctx.fill();
        const sw = seg(c, 1.0, 1.6);                                               // kiiltopyyhkäisy
        if (sw > 0 && sw < 1 && !RM) { const sx = lerp(-W / 2 - 80, W / 2 + 80, E.inOutCubic(sw)); ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath(); ctx.moveTo(sx - 26, H / 2); ctx.lineTo(sx + 14, -H / 2); ctx.lineTo(sx + 58, -H / 2); ctx.lineTo(sx + 18, H / 2); ctx.closePath(); ctx.fill(); }
        ctx.restore();
        rr(ctx, -W / 2, -H / 2, W, H, H / 2); ctx.stroke();
        ctext('Hienoa!', 0, 0, 78, C.viiva, 700);
        const s2_ = RM ? 1 : E.outBack((c - 0.62) / 0.4), s3_ = RM ? 1 : E.outBack((c - 0.74) / 0.4);
        drawStar(ctx, -W / 2 + 6, -H / 2 + 4, 44 * s2_, -0.3, OUT); drawStar(ctx, W / 2 - 8, -H / 2 + 2, 36 * s3_, 0.3, OUT);
        ctx.restore();
      }
    });
  },
};
// dia 5 on pelinäkymä, dia 6 tehosteet
const slides = [s1, s2, s3, s4, s5, s6];

// ───────────────────────── 10. Selaus ja pääsilmukka ─────────────────────────
let cur = 0, tr = null, T = 0, last = 0, auto = false, autoT = 0;
const TR_D = 0.44, AUTO_S = 12;
const dotsEl = document.getElementById('pisteet'), hintEl = document.getElementById('vihje'), autoEl = document.getElementById('auto');
const dots = slides.map((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Dia ${i + 1}: ${s.name}`);
  b.appendChild(document.createElement('span')); b.addEventListener('click', () => go(i)); dotsEl.appendChild(b); return b;
});
function syncDots(i) { dots.forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false')); }
function go(n) {
  n = clamp(n, 0, slides.length - 1); autoT = 0;
  const target = tr ? tr.to : cur;
  if (n === target) return;
  if (tr && !tr.sw) { tr.to = n; tr.dir = n > cur ? 1 : -1; } else tr = { to: n, dir: n > cur ? 1 : -1, t: 0, sw: false };
  syncDots(n); hintEl.classList.remove('nakyy');
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) { /* file:// */ }
}
const next = () => go((tr ? tr.to : cur) + 1), prev = () => go((tr ? tr.to : cur) - 1);
function setAuto(on) { auto = on; autoT = 0; autoEl.classList.toggle('nakyy', on); }

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && e.target && e.target.tagName === 'BUTTON') return; // kohdistettu piste hoitaa itse
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { next(); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { prev(); e.preventDefault(); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(slides.length - 1);
  else if (k >= '1' && k <= String(slides.length)) go(+k - 1);
  else if (k === 'a' || k === 'A') setAuto(!auto);
  else if (k === 'f' || k === 'F') {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); } else if (el.requestFullscreen) { const p = el.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  }
});
let down = null;
cv.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, ui: false };
  const sl = slides[cur];
  if (!tr && sl.hit && sl.hit((e.clientX - view.ox) / view.s, (e.clientY - view.oy) / view.s)) down.ui = true;
});
const pointerEnd = (e, cancel) => {
  for (const s of slides) if (s.release) s.release();
  const d = down; down = null;
  if (!d || d.ui || cancel) return;
  const dx = e.clientX - d.x;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(e.clientY - d.y)) { if (dx < 0) next(); else prev(); }  // pyyhkäisy
  else if (e.clientX < view.W / 2) prev(); else next();                                                   // napautus: vasen / oikea puolisko
};
cv.addEventListener('pointerup', (e) => pointerEnd(e, false));
cv.addEventListener('pointercancel', (e) => pointerEnd(e, true));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

function chevrons() { // hienovaraiset nuolet reunoissa
  const i = tr ? tr.to : cur;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,244,214,0.22)';
  ctx.beginPath();
  if (i > 0) { const x = view.x0 + 34; ctx.moveTo(x + 9, DH / 2 - 18); ctx.lineTo(x - 9, DH / 2); ctx.lineTo(x + 9, DH / 2 + 18); }
  if (i < slides.length - 1) { const x = view.x1 - 34; ctx.moveTo(x - 9, DH / 2 - 18); ctx.lineTo(x + 9, DH / 2); ctx.lineTo(x - 9, DH / 2 + 18); }
  ctx.stroke();
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? clamp((now - last) / 1000, 0, 0.05) : 0; last = now; T += dt;
  if (auto) { autoT += dt; if (autoT > AUTO_S) go(((tr ? tr.to : cur) + 1) % slides.length); }
  let shift = 0, cover = 0;
  if (tr) { // siirtymä: vanha dia häipyy taustaan, uusi nousee esiin
    tr.t += dt; const k = tr.t / TR_D;
    if (!tr.sw && k >= 0.5) { tr.sw = true; cur = tr.to; slides[cur].enter(); }
    if (k < 0.5) { const e = E.inCubic(k * 2); shift = -tr.dir * 46 * e; cover = e; }
    else { const e = E.outCubic((k - 0.5) * 2); shift = tr.dir * 46 * (1 - e); cover = 1 - e; }
    if (k >= 1) { tr = null; shift = 0; cover = 0; }
  }
  const sl = slides[cur];
  sl.update(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(bg, 0, 0, cv.width, cv.height);
  setDesign(RM ? 0 : shift);
  if (!sl.full) drawSkyStars(T, view.y1);
  sl.draw();
  chevrons();
  if (cover > 0.001) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = cover; ctx.drawImage(bg, 0, 0, cv.width, cv.height); ctx.globalAlpha = 1; }
}

// Käynnistys
resize();
const h0 = parseInt((location.hash || '').slice(1), 10);
if (h0 >= 1 && h0 <= slides.length) cur = h0 - 1;
syncDots(cur); slides[cur].enter();
if (/[?&]auto=1/.test(location.search)) setAuto(true);
const t0 = parseFloat((/[?&]t=([\d.]+)/.exec(location.search) || [])[1]); // ?t=3.5 kelaa dian alkuun 3,5 s (tarkistuskuvia varten)
if (t0 > 0) { for (let i = 0; i < Math.min(t0, 120) * 60; i++) slides[cur].update(1 / 60); T += t0; }
if (cur === 0) { hintEl.classList.add('nakyy'); setTimeout(() => hintEl.classList.remove('nakyy'), 7000); }
if (document.fonts && document.fonts.load) { // fontin lataus: logo piirretään uudelleen, kun Fredoka on valmis
  const bump = () => { fontVer++; };
  Promise.all([400, 500, 600, 700].map((w) => document.fonts.load(font(w, 40), 'Pomp! 123'))).then(bump, bump);
  if (document.fonts.ready) document.fonts.ready.then(bump, bump);
}
requestAnimationFrame(frame);
})();
